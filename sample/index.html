<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample documents · DocVault</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #F6F4EE; --text: #1B1F1D; --muted: #5C6460; --primary: #0F4F4A; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101412; --text: #ECEFED; --muted: #A3ABA7; --primary: #7FC8BE; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  a { color: var(--primary); }
  p { color: var(--muted); }
  img { width: 100%; height: auto; border-radius: 12px; margin: 12px 0 28px; }
</style>
</head>
<body>
<main>
  <h1>Sample documents</h1>
  <p>
    Fictional documents for trying DocVault (Belge Kasası). Save an image to Photos and choose it with
    "From library", or photograph it from this screen with "Take photo". Names, numbers and companies are made up.
  </p>
  <h2>Car insurance policy (US date format)</h2>
  <img src="car-insurance-policy.jpg" alt="Fictional car insurance policy with an expiration date of 12/14/2026">
  <h2>Kasko poliçesi (Turkish)</h2>
  <img src="kasko-policesi.jpg" alt="Fictional Turkish car insurance policy with an end date of 14.12.2026">
</main>
</body>
</html>
